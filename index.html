<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 게임 사이트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>내 게임 사이트</h1>
    <p>직접 만든 게임을 플레이해 보세요.</p>
  </header>

  <main>
    <div class="game-frame">
      <!-- 지금은 테스트용 게임입니다. 내 게임으로 교체하세요. -->
      <canvas id="game" width="640" height="360" tabindex="0"></canvas>
    </div>
    <p class="hint">게임 화면을 클릭한 뒤 방향키(또는 WASD)로 움직여 보세요.</p>
  </main>

  <footer>
    <p>&copy; 2026 내 게임 사이트</p>
  </footer>

  <script src="game.js"></script>
</body>
</html>
