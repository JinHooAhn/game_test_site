<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>분수 맞추기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone = picture and fraction side by side, keypad below; wide screens = big picture left, fraction + keypad right. */
:root{
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;

  --bg:#EDF0F7;
  --card:#FFFFFF;
  --ink:#16203A;
  --muted:#5B6685;
  --line:#C9D1E4;

  --fill:#2B59D6;
  --on-fill:#FFFFFF;
  --empty:#F4F6FC;

  --box-bg:#FFF1B8;
  --box-edge:#C99A00;
  --box-ink:#16203A;

  --good:#1E9E62;
  --good-bg:#D6F3E3;
  --good-ink:#0E5A37;
  --bad:#D9363E;
  --bad-bg:#FBDADC;
  --bad-ink:#8E1A21;
  --warn:#D99A00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424;
    --card:#161E36;
    --ink:#E8EDF8;
    --muted:#9AA6C6;
    --line:#2E3A5E;
    --fill:#5F86FF;
    --on-fill:#0E1630;
    --empty:#1E2848;
    --box-bg:#3A3110;
    --box-edge:#F2B84B;
    --box-ink:#FFE9A8;
    --good:#3DD68C;
    --good-bg:#123B2A;
    --good-ink:#9BF0C6;
    --bad:#FF6B72;
    --bad-bg:#46181C;
    --bad-ink:#FFC2C5;
    --warn:#F2B84B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424;
  --card:#161E36;
  --ink:#E8EDF8;
  --muted:#9AA6C6;
  --line:#2E3A5E;
  --fill:#5F86FF;
  --on-fill:#0E1630;
  --empty:#1E2848;
  --box-bg:#3A3110;
  --box-edge:#F2B84B;
  --box-ink:#FFE9A8;
  --good:#3DD68C;
  --good-bg:#123B2A;
  --good-ink:#9BF0C6;
  --bad:#FF6B72;
  --bad-bg:#46181C;
  --bad-ink:#FFC2C5;
  --warn:#F2B84B;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  padding-block:18px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--fill);outline-offset:2px}

.app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:0;letter-spacing:.01em}
.stats{display:flex;gap:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700;font-size:16px}

.pips{display:flex;gap:6px}
.pip{flex:1;height:8px;border-radius:4px;background:var(--line)}
.pip.cur{background:var(--fill);opacity:.45}
.pip.first{background:var(--good)}
.pip.later{background:var(--warn)}
.pip.miss{background:var(--bad)}

.stage{
  display:grid;
  gap:12px 14px;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  grid-template-areas:"fig frac" "msg msg" "keys keys" "mode mode";
}
.figure{
  grid-area:fig;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:12px;
  display:flex;align-items:center;justify-content:center;
}
.figure svg{width:100%;max-width:380px;aspect-ratio:1/1;display:block;animation:pop .35s ease-out}
.cell{stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.cell.on{fill:var(--fill)}
.cell.off{fill:var(--empty)}

.frac{grid-area:frac;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0}
.chip{
  font-size:13px;font-weight:700;letter-spacing:.04em;
  padding:4px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);
}
.fraction{
  display:inline-flex;flex-direction:column;align-items:center;gap:.1em;
  font-family:var(--display);font-size:clamp(44px,13.5vw,88px);line-height:1;
  font-variant-numeric:tabular-nums;
}
.fraction .num,.fraction .den{display:flex;align-items:center;justify-content:center;min-width:1.3em;height:1.25em}
.fraction .bar{width:100%;min-width:1.5em;height:.07em;border-radius:2px;background:var(--ink)}
.box{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.1em;height:1.1em;border-radius:.2em;
  border:.06em dashed var(--box-edge);background:var(--box-bg);color:var(--box-ink);
}
.box.good{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
.box.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink);animation:shake .45s}
.box.reveal{border-style:solid;border-color:var(--warn);animation:pop .3s ease-out}

.msg{
  grid-area:msg;min-height:2.9em;margin:0;text-align:center;
  font-size:15px;line-height:1.45;color:var(--muted);
}
.msg.good{color:var(--good-ink);font-weight:700}
.msg.hint{color:var(--ink)}

.keys{grid-area:keys;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.key{
  min-height:58px;border-radius:14px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 3px 0 var(--line);
  font-family:var(--display);font-size:30px;line-height:1;
}
.key:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
@media (hover:hover){.key:hover{border-color:var(--fill)}}

.mode{grid-area:mode;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);font-weight:700}

.result{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;
}
.result .big{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.result p{margin:0;font-size:16px;line-height:1.5}
.result .sub{color:var(--muted);font-size:14px}
.again{
  margin-top:12px;border:0;cursor:pointer;border-radius:14px;
  background:var(--fill);color:var(--on-fill);
  font-family:var(--display);font-size:24px;padding:12px 34px;
  box-shadow:0 3px 0 rgba(0,0,0,.25);
}
.again:active{transform:translateY(3px);box-shadow:none}

@media (min-width:820px){
  body{padding-block:32px 40px}
  h1{font-size:36px}
  .stage{
    gap:14px 28px;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"fig frac" "fig msg" "fig keys" "fig mode";
    grid-template-rows:auto auto auto 1fr;
    align-items:start;
  }
  .figure{padding:24px;align-self:stretch}
  .fraction{font-size:96px}
  .key{min-height:66px;font-size:34px}
}

@keyframes pop{from{transform:scale(.92);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-.09em)}
  40%{transform:translateX(.09em)}
  60%{transform:translateX(-.06em)}
  80%{transform:translateX(.06em)}
}
@media (prefers-reduced-motion:reduce){
  .figure svg,.box.bad,.box.reveal{animation:none}
}
</style>

<main class="app">
  <header class="top">
    <h1>분수 맞추기</h1>
    <div class="stats" aria-live="off">
      <span>문제 <b id="qno">1</b>/10</span>
      <span>점수 <b id="score">0</b></span>
      <span>연속 <b id="streak">0</b></span>
    </div>
  </header>

  <div class="pips" id="pips" aria-hidden="true"></div>

  <section class="stage" id="stage">
    <div class="figure" id="figure"></div>
    <div class="frac">
      <span class="chip" id="chip">분자 찾기</span>
      <div class="fraction" id="fraction" role="group" aria-label="분수">
        <span class="num" id="num"></span>
        <span class="bar"></span>
        <span class="den" id="den"></span>
      </div>
    </div>
    <p class="msg" id="msg" aria-live="polite">색칠한 부분을 분수로 나타내요. 네모에 알맞은 수를 눌러 보세요.</p>
    <div class="keys" id="keys" role="group" aria-label="숫자 키패드"></div>
    <div class="mode">
      <span>문제 유형</span>
      <div class="seg" id="seg" role="group" aria-label="문제 유형">
        <button type="button" data-mode="mix" aria-pressed="true">섞어서</button>
        <button type="button" data-mode="num" aria-pressed="false">분자</button>
        <button type="button" data-mode="den" aria-pressed="false">분모</button>
      </div>
    </div>
  </section>

  <section class="result" id="result" hidden>
    <p class="sub">10문제 끝!</p>
    <div class="big" id="rScore">0</div>
    <p id="rText"></p>
    <p class="sub" id="rBest"></p>
    <button type="button" class="again" id="again">다시 하기</button>
  </section>
</main>

<script>
(function(){
/*PURE-START*/
var SHAPES=[
  {id:'c2',kind:'circle',n:2},{id:'c3',kind:'circle',n:3},{id:'c4',kind:'circle',n:4},
  {id:'c5',kind:'circle',n:5},{id:'c6',kind:'circle',n:6},{id:'c8',kind:'circle',n:8},
  {id:'sq4',kind:'cross',n:4},{id:'sq5',kind:'strips',n:5},
  {id:'p3',kind:'poly',n:3},{id:'p4',kind:'poly',n:4},{id:'p5',kind:'poly',n:5},{id:'p6',kind:'poly',n:6}
];
function isCyclic(s){return s.kind!=='strips';}
function neighbors(s,i){
  var n=s.n;
  if(isCyclic(s)) return [(i+1)%n,(i+n-1)%n];
  return [i-1,i+1].filter(function(j){return j>=0&&j<n;});
}
function pickBlock(s,k,rnd){
  var n=s.n,st,out=[],j;
  if(isCyclic(s)){
    st=Math.floor(rnd()*n);
    for(j=0;j<k;j++) out.push((st+j)%n);
  }else{
    st=Math.floor(rnd()*(n-k+1));
    for(j=0;j<k;j++) out.push(st+j);
  }
  return out;
}
function shuffle(a,rnd){
  var b=a.slice(),i,j,t;
  for(i=b.length-1;i>0;i--){j=Math.floor(rnd()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}
function f(x){return x.toFixed(2);}
function polar(cx,cy,r,deg){var a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function cellPaths(s){
  var out=[],n=s.n,i;
  if(s.kind==='circle'){
    var cx=100,cy=100,r=90;
    for(i=0;i<n;i++){
      var p0=polar(cx,cy,r,-90+i*360/n),p1=polar(cx,cy,r,-90+(i+1)*360/n);
      out.push('M'+cx+' '+cy+' L'+f(p0[0])+' '+f(p0[1])+' A'+r+' '+r+' 0 0 1 '+f(p1[0])+' '+f(p1[1])+' Z');
    }
  }else if(s.kind==='cross'){
    var o=[[10,10],[100,10],[100,100],[10,100]];
    for(i=0;i<4;i++) out.push('M'+o[i][0]+' '+o[i][1]+' h90 v90 h-90 Z');
  }else if(s.kind==='strips'){
    for(i=0;i<n;i++) out.push('M10 '+(10+i*36)+' h180 v36 h-180 Z');
  }else{
    var start={3:-90,4:-45,5:-90,6:0}[n],pts=[],minx=9,maxx=-9,miny=9,maxy=-9;
    for(i=0;i<n;i++){
      var a=(start+360*i/n)*Math.PI/180,x=Math.cos(a),y=Math.sin(a);
      pts.push([x,y]);
      minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);
    }
    var sc=180/Math.max(maxx-minx,maxy-miny),mx=(minx+maxx)/2,my=(miny+maxy)/2;
    var map=function(p){return [100+(p[0]-mx)*sc,100+(p[1]-my)*sc];};
    var c=map([0,0]);
    for(i=0;i<n;i++){
      var q0=map(pts[i]),q1=map(pts[(i+1)%n]);
      out.push('M'+f(c[0])+' '+f(c[1])+' L'+f(q0[0])+' '+f(q0[1])+' L'+f(q1[0])+' '+f(q1[1])+' Z');
    }
  }
  return out;
}
function figureSVG(s,colored){
  var on={},i;
  for(i=0;i<colored.length;i++) on[colored[i]]=true;
  var cells=cellPaths(s).map(function(d,idx){
    return '<path class="cell '+(on[idx]?'on':'off')+'" d="'+d+'"/>';
  }).join('');
  return '<svg viewBox="0 0 200 200" role="img" aria-label="색칠된 분수 그림">'+cells+'</svg>';
}
/*PURE-END*/

var TOTAL=10;
var $=function(id){return document.getElementById(id);};
var deck,qIndex,score,streak,firstTry,attempts,locked,cur,mode='mix',pipState,timer;
var best=0;
try{best=parseInt(localStorage.getItem('fraction-best')||'0',10)||0;}catch(e){}

function buildKeys(){
  var keys=[1,2,3,4,5,6,7,8,9,0],html='';
  keys.forEach(function(d){
    html+='<button type="button" class="key" data-d="'+d+'" aria-label="'+d+'">'+d+'</button>';
  });
  $('keys').innerHTML=html;
}
function renderPips(){
  var html='';
  for(var i=0;i<TOTAL;i++){
    var c=pipState[i]||(i===qIndex?'cur':'');
    html+='<span class="pip '+c+'"></span>';
  }
  $('pips').innerHTML=html;
}
function renderStats(){
  $('qno').textContent=Math.min(qIndex+1,TOTAL);
  $('score').textContent=score;
  $('streak').textContent=streak;
}
function setMsg(text,cls){
  var m=$('msg');
  m.textContent=text;
  m.className='msg'+(cls?' '+cls:'');
}
function renderFraction(){
  var box='<span class="box" id="box"></span>';
  $('num').innerHTML=cur.ask==='num'?box:cur.k;
  $('den').innerHTML=cur.ask==='den'?box:cur.n;
  $('chip').textContent=cur.ask==='num'?'분자 찾기':'분모 찾기';
}
function nextQuestion(){
  var shape=deck[qIndex],n=shape.n;
  var k=1+Math.floor(Math.random()*(n-1));
  var ask=mode==='mix'?(Math.random()<0.5?'num':'den'):mode;
  cur={shape:shape,n:n,k:k,ask:ask,answer:ask==='num'?k:n,colored:pickBlock(shape,k,Math.random)};
  attempts=0;locked=false;
  $('figure').innerHTML=figureSVG(shape,cur.colored);
  renderFraction();
  renderPips();renderStats();
  setMsg('색칠한 부분을 분수로 나타내요. 네모에 알맞은 수를 눌러 보세요.');
}
function newRound(){
  clearTimeout(timer);
  deck=shuffle(SHAPES,Math.random).slice(0,TOTAL);
  qIndex=0;score=0;streak=0;firstTry=0;pipState=[];
  $('result').hidden=true;
  $('stage').hidden=false;
  nextQuestion();
}
function showResult(){
  $('stage').hidden=true;
  $('result').hidden=false;
  var isBest=score>best;
  if(isBest){best=score;try{localStorage.setItem('fraction-best',String(best));}catch(e){}}
  $('rScore').textContent=score+'점';
  $('rText').textContent=TOTAL+'문제 중 '+firstTry+'문제를 한 번에 맞혔어요.';
  $('rBest').textContent=isBest?'새 최고 점수예요!':'최고 점수 '+best+'점';
  $('again').focus();
}
function advance(){
  qIndex++;
  if(qIndex>=TOTAL){renderStats();renderPips();showResult();}
  else nextQuestion();
}
function press(d){
  if(locked||!cur) return;
  attempts++;
  var box=$('box');
  box.textContent=d;
  locked=true;
  if(d===cur.answer){
    box.className='box good';
    score+=[10,6,3][attempts-1];
    if(attempts===1){firstTry++;streak++;}else streak=0;
    pipState[qIndex]=attempts===1?'first':'later';
    renderPips();renderStats();
    setMsg('정답! 전체 '+cur.n+'칸 중 '+cur.k+'칸이 색칠되어 있어요.','good');
    timer=setTimeout(advance,1500);
    return;
  }
  box.className='box bad';
  if(attempts>=3){
    streak=0;
    pipState[qIndex]='miss';
    renderStats();
    timer=setTimeout(function(){
      var b=$('box');
      b.className='box reveal';b.textContent=cur.answer;
      renderPips();
      setMsg('정답은 '+cur.answer+'이에요. 전체 '+cur.n+'칸 중 '+cur.k+'칸이 색칠되어 있어요.','hint');
      timer=setTimeout(advance,2400);
    },650);
    return;
  }
  setMsg(attempts===1
    ?(cur.ask==='num'?'색칠된 칸이 몇 개인지 세어 보세요.':'그림이 전체 몇 칸으로 나뉘었는지 세어 보세요.')
    :(cur.ask==='num'?'분자는 색칠된 칸만 세어요. 색칠하지 않은 칸은 빼세요.':'분모는 색칠하지 않은 칸까지 포함해 전체 칸을 세어요.'),'hint');
  timer=setTimeout(function(){
    var b=$('box');
    if(b){b.className='box';b.textContent='';}
    locked=false;
  },650);
}

buildKeys();
$('keys').addEventListener('click',function(e){
  var b=e.target.closest('.key');
  if(b) press(parseInt(b.getAttribute('data-d'),10));
});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(!$('result').hidden) return;
  if(/^[0-9]$/.test(e.key)) press(parseInt(e.key,10));
});
$('seg').addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b) return;
  mode=b.getAttribute('data-mode');
  Array.prototype.forEach.call($('seg').children,function(x){
    x.setAttribute('aria-pressed',x===b?'true':'false');
  });
});
$('again').addEventListener('click',newRound);
newRound();
})();
</script>

</body></html>
